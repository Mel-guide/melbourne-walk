<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>멜버른 셀프 가이드 도보 투어</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f8fafc; color: #0f172a; overflow: hidden; }

    /* 상단 내비게이션 바 */
    header { height: 54px; background: #0f172a; color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .header-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .btn-gps { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .btn-gps.active { background: #0284c7; color: white; border-color: #0284c7; }

    /* 투어 선택 드롭다운 바 */
    .tour-selector-bar { background: #ffffff; padding: 8px 14px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 10px; z-index: 999; }
    .tour-select { flex: 1; height: 36px; border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 0 10px; font-size: 13px; font-weight: 600; color: #1e293b; background: white; outline: none; }
    .tour-meta { font-size: 11px; color: #64748b; white-space: nowrap; }

    /* 지도 영역 */
    #map { flex: 1; width: 100%; height: 100%; z-index: 10; }

    /* 하단 가변형 바텀 시트 */
    .bottom-sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: white; border-radius: 18px 18px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.18);
      z-index: 1001; 
      height: 140px;
      max-height: 140px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column;
    }
    .bottom-sheet.expanded { 
      height: 70vh; 
      max-height: 70vh; 
    }

    .sheet-handle-bar {
      width: 100%; height: 32px; display: flex; justify-content: center; align-items: center;
      cursor: pointer; flex-shrink: 0; border-bottom: 1px solid #f1f5f9;
      touch-action: none;
    }
    .sheet-handle { width: 44px; height: 5px; background: #cbd5e1; border-radius: 3px; }

    .sheet-content { padding: 8px 18px 24px 18px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
    
    .spot-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .spot-num-badge { background: #2563eb; color: white; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 2px; }
    .spot-title { font-size: 16px; font-weight: 800; color: #0f172a; line-height: 1.3; }
    .spot-category { font-size: 11px; color: #64748b; }

    /* 오디오 플레이어 UI */
    .audio-player-box {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px;
      padding: 8px 12px; display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; gap: 8px;
    }
    .btn-play-toggle {
      width: 38px; height: 38px; border-radius: 50%; background: #2563eb;
      border: none; color: white; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(37,99,235,0.4);
    }
    .btn-play-toggle.pulse { animation: pulseAnim 1.5s infinite; background: #ef4444; }
    @keyframes pulseAnim {
      0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); }
      70% { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }

    .player-text { flex: 1; font-size: 12px; font-weight: 600; color: #334155; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-toggle-sheet { 
      background: white; border: 1px solid #cbd5e1; border-radius: 6px; 
      padding: 6px 10px; font-size: 11px; font-weight: 600; cursor: pointer; color: #475569;
      transition: background 0.2s, border-color 0.2s;
    }

    /* 길안내 알림창 */
    .cue-banner {
      background: #eff6ff; border-left: 4px solid #2563eb;
      padding: 8px 10px; border-radius: 0 6px 6px 0; font-size: 12px;
      color: #1e40af; margin-bottom: 10px; line-height: 1.4;
    }

    /* 본 해설 텍스트 스크립트 */
    .script-box {
      font-size: 13px; line-height: 1.65; color: #334155;
      background: #fdfdfd; border: 1px solid #f1f5f9; border-radius: 8px;
      padding: 12px; white-space: pre-line;
    }

    /* Leaflet 커스텀 마커 */
    .leaflet-div-icon { background: transparent !important; border: none !important; }
    .marker-stop {
      background: #2563eb; color: white; border: 2.5px solid white; border-radius: 50%;
      width: 28px !important; height: 28px !important; line-height: 23px; text-align: center;
      font-size: 12px; font-weight: 800; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .marker-stop.active {
      background: #ef4444; width: 34px !important; height: 34px !important;
      line-height: 29px; font-size: 14px; box-shadow: 0 3px 10px rgba(239,68,68,0.5);
    }
    .user-gps-dot {
      background: #0284c7; width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid white; box-shadow: 0 0 0 5px rgba(2,132,199,0.35);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">🦘 멜버른 투어 가이드</div>
    <div class="header-right">
      <button class="btn-gps" id="btnGpsToggle">📍 GPS 켜기</button>
    </div>
  </header>

  <div class="tour-selector-bar">
    <select id="selTour" class="tour-select"></select>
    <div class="tour-meta" id="tourMetaInfo">--분 / --km</div>
  </div>

  <div id="map"></div>

  <!-- 하단 상세 정보 시트 -->
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle-bar" id="sheetHandleBar">
      <div class="sheet-handle"></div>
    </div>
    <div class="sheet-content">
      <div class="spot-header">
        <div>
          <span class="spot-num-badge" id="spotBadge">#1 첫 번째 스팟</span>
          <h2 class="spot-title" id="spotTitle">명소 로딩 중...</h2>
        </div>
        <span class="spot-category" id="spotCategory">카테고리</span>
      </div>

      <div class="audio-player-box">
        <button class="btn-play-toggle" id="btnPlayToggle">▶</button>
        <div class="player-text" id="playerStatus">해설 듣기</div>
        <button class="btn-toggle-sheet" id="btnToggleDetail">대본 보기 ↕</button>
      </div>

      <div class="cue-banner" id="spotNavCue">
        🚶 <strong>이동 안내:</strong> 경로를 따라 이동하세요.
      </div>

      <div class="script-box" id="spotScript">
        스팟 해설이 여기에 표시됩니다.
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let currentTourData = null;
    let currentToursList = [];
    let activeTourIdx = 0;
    let activeStopIdx = 0;

    let map = null;
    let markersLayer = L.layerGroup();
    let routePolyline = null;
    let userMarker = null;
    let userAccuracyCircle = null;
    let gpsWatchId = null;

    let audioElement = new Audio();
    let isPlaying = false;
    let isTtsSpeaking = false;
    let koVoice = null;

    initApp();

    async function initApp() {
      initMap();
      setupVoiceSynthesis();
      await loadTourMasterData();
      renderTourSelector();
      loadTour(0);
      setupEvents();
    }

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([-37.818000, 144.967100], 16);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri'
      }).addTo(map);
      markersLayer.addTo(map);
      L.control.zoom({ position: 'topright' }).addTo(map);
    }

    function setupVoiceSynthesis() {
      if (!('speechSynthesis' in window)) return;
      const getKoVoice = () => {
        const voices = window.speechSynthesis.getVoices();
        koVoice = voices.find(v => v.lang.includes('ko') || v.lang.includes('KO')) || null;
      };
      getKoVoice();
      window.speechSynthesis.onvoiceschanged = getKoVoice;
    }

    // tours_master.json 파일만 직접 로드 (캐시 무효화 파라미터 포함)
    async function loadTourMasterData() {
      try {
        const res = await fetch(`tours_master.json?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        const data = await res.json();
        
        currentToursList = (data.tours || []).map(tour => {
          let sortedStops = (tour.stops || []).map((stop, idx) => ({
            ...stop,
            sequence: stop.sequence || (idx + 1),
            desc: stop.script_full || stop.desc || ""
          }));

          // sequence 필드가 있을 경우 명시적 오름차순 정렬
          sortedStops.sort((a, b) => (a.sequence || 0) - (b.sequence || 0));

          // 정렬 순서대로 1, 2, 3 재부여
          sortedStops = sortedStops.map((s, idx) => ({ ...s, sequence: idx + 1 }));

          return { ...tour, stops: sortedStops };
        });
      } catch (err) {
        console.error("tours_master.json 로드 실패:", err);
        alert("투어 데이터(tours_master.json)를 불러오지 못했습니다.");
      }
    }

    function renderTourSelector() {
      const sel = document.getElementById('selTour');
      sel.innerHTML = "";
      currentToursList.forEach((t, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = t.title_ko;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', (e) => loadTour(parseInt(e.target.value, 10)));
    }

    async function loadTour(idx) {
      stopAllAudio();
      activeTourIdx = idx;
      activeStopIdx = 0;
      currentTourData = currentToursList[idx];
      if (!currentTourData) return;

      document.getElementById('tourMetaInfo').innerText = `${currentTourData.estimated_min || '--'}분 / ${currentTourData.distance_km || '--'}km`;

      renderStopsOnMap();
      await loadTourRoutePolyline(currentTourData);
      selectStop(0);
    }

    function renderStopsOnMap() {
      markersLayer.clearLayers();
      const bounds = [];

      currentTourData.stops.forEach((stop, i) => {
        const latlng = [stop.lat, stop.lng];
        bounds.push(latlng);

        const icon = L.divIcon({
          className: `marker-stop ${i === activeStopIdx ? 'active' : ''}`,
          html: `<div>${i + 1}</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });

        const marker = L.marker(latlng, { icon: icon });
        marker.on('click', () => selectStop(i));
        markersLayer.addLayer(marker);
      });

      if (bounds.length > 0) map.fitBounds(bounds, { padding: [40, 40] });
    }

    // GeoJSON 보행 도로선 로드
    async function loadTourRoutePolyline(tour) {
      if (routePolyline) { map.removeLayer(routePolyline); routePolyline = null; }

      const paths = [
        tour.route_file,
        `data/routes/route_${tour.tour_id}.geojson`,
        `route_${tour.tour_id}.geojson`
      ];

      for (const p of paths) {
        if (!p) continue;
        try {
          const res = await fetch(`${p}?t=${Date.now()}`);
          if (res.ok) {
            const geojson = await res.json();
            const coords = geojson.geometry.coordinates.map(c => [c[1], c[0]]);
            routePolyline = L.polyline(coords, { color: '#2563eb', weight: 5, opacity: 0.85 }).addTo(map);
            break;
          }
        } catch (e) {}
      }
    }

    function selectStop(index, isGeofenceTrigger = false) {
      activeStopIdx = index;
      const stop = currentTourData.stops[index];
      if (!stop) return;

      stopAllAudio();

      document.getElementById('spotBadge').innerText = `#${index + 1} 스팟`;
      document.getElementById('spotTitle').innerText = stop.name_ko;
      document.getElementById('spotCategory').innerText = stop.category || "명소";
      document.getElementById('spotNavCue').innerHTML = `🚶 <strong>이동 팁:</strong> ${stop.nav_cue || "안내선을 따라 다음 명소로 걸어가세요."}`;
      document.getElementById('spotScript').innerText = stop.script_full || stop.desc || "해설 내용이 없습니다.";

      const btnPlay = document.getElementById('btnPlayToggle');
      if (isGeofenceTrigger) {
        btnPlay.classList.add('pulse');
        document.getElementById('playerStatus').innerText = "스팟 도착! 터치하여 재생 ▶";
      } else {
        btnPlay.classList.remove('pulse');
        document.getElementById('playerStatus').innerText = stop.audio_url ? "오디오 해설 듣기" : "AI 음성 해설 듣기";
      }

      renderStopsOnMap();
      map.panTo([stop.lat, stop.lng]);
    }

    function setupEvents() {
      const btnPlay = document.getElementById('btnPlayToggle');
      const sheet = document.getElementById('bottomSheet');
      const handleBar = document.getElementById('sheetHandleBar');
      const btnToggle = document.getElementById('btnToggleDetail');

      const toggleSheet = (e) => {
        if (e) e.stopPropagation();
        const isExpanded = sheet.classList.toggle('expanded');
        if (isExpanded) {
          btnToggle.innerText = "대본 닫기 ✕";
          btnToggle.style.background = "#e2e8f0";
        } else {
          btnToggle.innerText = "대본 보기 ↕";
          btnToggle.style.background = "white";
          const content = sheet.querySelector('.sheet-content');
          if (content) content.scrollTop = 0;
        }
      };

      handleBar.addEventListener('click', toggleSheet);
      btnToggle.addEventListener('click', toggleSheet);

      btnPlay.addEventListener('click', () => {
        btnPlay.classList.remove('pulse');
        const stop = currentTourData.stops[activeStopIdx];
        if (!stop) return;

        if (isPlaying || isTtsSpeaking) {
          stopAllAudio();
        } else {
          if (stop.audio_url) {
            audioElement.src = stop.audio_url;
            audioElement.play()
              .then(() => {
                isPlaying = true;
                btnPlay.innerText = "⏸";
                document.getElementById('playerStatus').innerText = "오디오 재생 중...";
              })
              .catch(() => playTTS(stop.script_full || stop.desc));
            audioElement.onended = stopAllAudio;
          } else {
            playTTS(stop.script_full || stop.desc);
          }
        }
      });

      document.getElementById('btnGpsToggle').addEventListener('click', toggleGPS);
    }

    function playTTS(text) {
      stopAllAudio();
      if (!('speechSynthesis' in window)) return alert("TTS를 지원하지 않는 브라우저입니다.");
      if (!text) return alert("읽어줄 대본이 없습니다.");

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      utter.rate = 0.95;
      if (koVoice) utter.voice = koVoice;

      utter.onstart = () => {
        isTtsSpeaking = true;
        document.getElementById('btnPlayToggle').innerText = "⏸";
        document.getElementById('playerStatus').innerText = "AI 해설 낭독 중...";
      };
      utter.onend = stopAllAudio;
      utter.onerror = stopAllAudio;

      window.speechSynthesis.speak(utter);
    }

    function stopAllAudio() {
      if (audioElement) { audioElement.pause(); audioElement.currentTime = 0; }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      isPlaying = false;
      isTtsSpeaking = false;
      document.getElementById('btnPlayToggle').innerText = "▶";
      document.getElementById('playerStatus').innerText = "해설 듣기";
    }

    function toggleGPS() {
      const btn = document.getElementById('btnGpsToggle');
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        btn.classList.remove('active');
        btn.innerText = "📍 GPS 켜기";
        if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
        if (userAccuracyCircle) { map.removeLayer(userAccuracyCircle); userAccuracyCircle = null; }
      } else {
        if (!navigator.geolocation) return alert("GPS를 지원하지 않는 브라우저입니다.");
        btn.classList.add('active');
        btn.innerText = "🛰️ 추적 중...";

        gpsWatchId = navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude, longitude, accuracy } = pos.coords;
            const latlng = [latitude, longitude];

            if (!userMarker) {
              const icon = L.divIcon({ className: 'user-gps-dot', iconSize: [16, 16], iconAnchor: [8, 8] });
              userMarker = L.marker(latlng, { icon: icon, zIndexOffset: 2000 }).addTo(map);
              userAccuracyCircle = L.circle(latlng, { radius: accuracy, color: '#0284c7', weight: 1, fillOpacity: 0.15 }).addTo(map);
              map.setView(latlng, 17);
            } else {
              userMarker.setLatLng(latlng);
              userAccuracyCircle.setLatLng(latlng);
              userAccuracyCircle.setRadius(accuracy);
            }

            checkGeofence(latitude, longitude);
          },
          (err) => alert("GPS 오류: " + err.message),
          { enableHighAccuracy: true, maximumAge: 4000, timeout: 10000 }
        );
      }
    }

    function checkGeofence(uLat, uLng) {
      if (!currentTourData) return;
      currentTourData.stops.forEach((stop, idx) => {
        const dist = getDistanceMeters(uLat, uLng, stop.lat, stop.lng);
        if (dist <= (stop.radius || 20) && activeStopIdx !== idx) {
          selectStop(idx, true);
          if (navigator.vibrate) navigator.vibrate([120, 80, 120]);
        }
      });
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
  </script>
</body>
</html>
